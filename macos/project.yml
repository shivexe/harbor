name: Harbor
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.2.0
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  HarborAskPass:
    type: tool
    platform: macOS
    sources: [HarborAskPass]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.askpass
        SKIP_INSTALL: YES
  Harbor:
    type: application
    platform: macOS
    sources: [Harbor]
    dependencies:
      - package: SwiftTerm
      - target: HarborAskPass
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.desktop
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Harbor syncs your host library with paired Android devices on your local network.
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_CFBundleDisplayName: Harbor
        INFOPLIST_KEY_CFBundleIconFile: Harbor.icns
    postBuildScripts:
      - name: Embed credential helper
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/HarborAskPass" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/HarborAskPass"
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/HarborAskPass"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/HarborAskPass"]
  HarborTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: ../shared/protocol-vectors.json
        buildPhase: resources
    dependencies:
      - target: Harbor
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.tests
schemes:
  Harbor:
    build:
      targets:
        Harbor: all
    test:
      targets: [HarborTests]
