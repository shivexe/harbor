<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="2840" viewBox="0 0 1860 2840" role="img" aria-labelledby="title desc">
<title id="title">04 / Manually sync the full host list</title><desc id="desc">The phone asks for a fresh copy. Every check passes before it replaces the saved list, including deletions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8d969b"/></marker></defs>
<style>
    text{font-family:Arial,DejaVu Sans,sans-serif;fill:#f2f3f3}
    .page-title{font-size:34px;font-weight:700}
    .section-title{font-size:30px;font-weight:700}
    .summary{font-size:19px;fill:#bdc3c6}
    .lane{font-size:18px;font-weight:700;letter-spacing:1px;fill:#bdc3c6}
    .node-title{font-size:21px;font-weight:700}
    .node-body{font-size:18px}
    .edge{font-size:16px;font-weight:700;fill:#f2f3f3}
    </style><rect width="1860" height="2840" fill="#17191c"/><text x="70" y="72" class="section-title">04 / Manually sync the full host list</text><text x="70" y="110" class="summary">The phone asks for a fresh copy. Every check passes before it replaces the saved list, including deletions.</text><text x="70" y="172" class="lane">DESKTOP</text><path d="M70,185 h440" stroke="#8d969b" stroke-width="1"/><text x="710" y="172" class="lane">ANDROID</text><path d="M710,185 h440" stroke="#8d969b" stroke-width="1"/><text x="1350" y="172" class="lane">CHECK / RESULT</text><path d="M1350,185 h440" stroke="#8d969b" stroke-width="1"/><path d="M1150,293.5 L1350,293.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1187.5" y="267.5" width="125.1" height="23" fill="#17191c"/><text x="1250.0" y="284.5" text-anchor="middle" class="edge">no connection</text><path d="M930.0,369.0 L930.0,451.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="909.9" y="398.0" width="64.2" height="23" fill="#17191c"/><text x="942.0" y="415.0" text-anchor="middle" class="edge">paired</text><path d="M1150,526.5 L1350,526.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1191.8" y="500.5" width="116.4" height="23" fill="#17191c"/><text x="1250.0" y="517.5" text-anchor="middle" class="edge">HTTP request</text><path d="M930.0,602.0 L930.0,657.0 L290.0,657.0 L290.0,684.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="547.5" y="631.0" width="125.1" height="23" fill="#17191c"/><text x="610.0" y="648.0" text-anchor="middle" class="edge">POST /v1/sync</text><path d="M510,819.0 L1350,759.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="911.0" y="733.5" width="38.0" height="23" fill="#17191c"/><text x="930.0" y="750.5" text-anchor="middle" class="edge">No</text><path d="M290.0,954.0 L290.0,1036.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="282.9" y="983.0" width="38.1" height="23" fill="#17191c"/><text x="302.0" y="1000.0" text-anchor="middle" class="edge">Yes</text><path d="M510,1111.5 L1350,1111.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="897.9" y="1085.5" width="64.2" height="23" fill="#17191c"/><text x="930.0" y="1102.5" text-anchor="middle" class="edge">limits</text><path d="M290.0,1187.0 L290.0,1269.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="235.1" y="1216.0" width="133.8" height="23" fill="#17191c"/><text x="302.0" y="1233.0" text-anchor="middle" class="edge">snapshot bytes</text><path d="M290.0,1420.0 L290.0,1475.0 L930.0,1475.0 L930.0,1502.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="508.3" y="1449.0" width="203.4" height="23" fill="#17191c"/><text x="610.0" y="1466.0" text-anchor="middle" class="edge">encrypted signed reply</text><path d="M1150,1565.0 L1350,1577.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1200.5" y="1539.0" width="99.0" height="23" fill="#17191c"/><text x="1250.0" y="1556.0" text-anchor="middle" class="edge">seal fails</text><path d="M930.0,1628.0 L930.0,1735.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="853.4" y="1669.5" width="177.3" height="23" fill="#17191c"/><text x="942.0" y="1686.5" text-anchor="middle" class="edge">authenticated bytes</text><path d="M1150,1856.0 L1350,1810.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="1784.5" width="38.0" height="23" fill="#17191c"/><text x="1250.0" y="1801.5" text-anchor="middle" class="edge">No</text><path d="M930.0,1977.0 L930.0,2059.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="923.0" y="2006.0" width="38.1" height="23" fill="#17191c"/><text x="942.0" y="2023.0" text-anchor="middle" class="edge">Yes</text><path d="M1150,2180.0 L1350,2134.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="2108.5" width="38.0" height="23" fill="#17191c"/><text x="1250.0" y="2125.5" text-anchor="middle" class="edge">No</text><path d="M930.0,2301.0 L930.0,2383.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="923.0" y="2330.0" width="38.1" height="23" fill="#17191c"/><text x="942.0" y="2347.0" text-anchor="middle" class="edge">Yes</text><path d="M1150,2458.5 L1350,2458.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1196.2" y="2432.5" width="107.7" height="23" fill="#17191c"/><text x="1250.0" y="2449.5" text-anchor="middle" class="edge">write fails</text><path d="M930.0,2534.0 L930.0,2616.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="875.1" y="2563.0" width="133.8" height="23" fill="#17191c"/><text x="942.0" y="2580.0" text-anchor="middle" class="edge">write succeeds</text><rect x="710" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="254" class="node-title">Tap Sync</text><text x="732" y="287" class="node-body">Use the saved desktop URL. The desktop must</text><text x="732" y="312" class="node-body">be reachable, unlocked, and sharing. There</text><text x="732" y="337" class="node-body">is no auto-discovery.</text><rect x="1350" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="254" class="node-title">Keep existing copy</text><text x="1372" y="287" class="node-body">Offline, stopped sharing, timeout, or</text><text x="1372" y="312" class="node-body">network error leaves the previous phone</text><text x="1372" y="337" class="node-body">hosts available.</text><rect x="710" y="451" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="487" class="node-title">Seal a fresh request</text><text x="732" y="520" class="node-body">Make a random 32-byte request ID. Encrypt</text><text x="732" y="545" class="node-body">vault ID and request ID with this phone's</text><text x="732" y="570" class="node-body">sync key and sync-request label.</text><rect x="1350" y="451" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="487" class="node-title">HTTP reveals metadata</text><text x="1372" y="520" class="node-body">IP, port, path, device ID, size, and timing</text><text x="1372" y="545" class="node-body">remain visible. Host data and credentials</text><text x="1372" y="570" class="node-body">stay inside encrypted bodies.</text><path d="M290.0,684 L510,819.0 L290.0,954 L70,819.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="290.0" y="753" text-anchor="middle" class="node-title">Authorized phone?</text><text x="290.0" y="783" text-anchor="middle" class="node-body">Use visible device ID to</text><text x="290.0" y="807" text-anchor="middle" class="node-body">find its key. Check the</text><text x="290.0" y="831" text-anchor="middle" class="node-body">sealed request, purpose</text><text x="290.0" y="855" text-anchor="middle" class="node-body">label, vault ID, and</text><text x="290.0" y="879" text-anchor="middle" class="node-body">version.</text><rect x="1350" y="684" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="720" class="node-title">Reject request</text><text x="1372" y="753" class="node-body">Unknown or revoked device: 403. Bad sealed</text><text x="1372" y="778" class="node-body">request: 400. Bad version or vault: Mac</text><text x="1372" y="803" class="node-body">400, Linux 403. Phone keeps its copy.</text><rect x="70" y="1036" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1072" class="node-title">Build full snapshot</text><text x="92" y="1105" class="node-body">Copy all hosts, credentials, vault ID,</text><text x="92" y="1130" class="node-body">revision, time, and echoed request ID;</text><text x="92" y="1155" class="node-body">bound the total size.</text><rect x="1350" y="1036" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="1072" class="node-title">Bound time and size</text><text x="1372" y="1105" class="node-body">At most 10,000 hosts, 256 KiB/key, 1</text><text x="1372" y="1130" class="node-body">MiB/host, 8 MiB snapshot, 16 MiB reply.</text><text x="1372" y="1155" class="node-body">Request: 16 KiB header, 512 KiB body, 10 s.</text><rect x="70" y="1269" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1305" class="node-title">Sign, then encrypt</text><text x="92" y="1338" class="node-body">Ed25519 signature proves which desktop</text><text x="92" y="1363" class="node-body">issued the bytes. AES-256-GCM hides and</text><text x="92" y="1388" class="node-body">seals them for this phone.</text><rect x="710" y="1502" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1538" class="node-title">Open response seal</text><text x="732" y="1571" class="node-body">AES-GCM checks the response using this</text><text x="732" y="1596" class="node-body">phone's sync key and sync-response label.</text><rect x="1350" y="1502" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1538" class="node-title">Reject bad seal</text><text x="1372" y="1571" class="node-body">Wrong key, purpose label, or changed</text><text x="1372" y="1596" class="node-body">ciphertext stops processing and keeps the</text><text x="1372" y="1621" class="node-body">prior host copy.</text><path d="M930.0,1735 L1150,1856.0 L930.0,1977 L710,1856.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="1804" text-anchor="middle" class="node-title">Signature valid?</text><text x="930.0" y="1834" text-anchor="middle" class="node-body">Verify exact signed bytes</text><text x="930.0" y="1858" text-anchor="middle" class="node-body">with the desktop public</text><text x="930.0" y="1882" text-anchor="middle" class="node-body">key pinned from the</text><text x="930.0" y="1906" text-anchor="middle" class="node-body">pairing QR.</text><rect x="1350" y="1735" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1771" class="node-title">Reject entire response</text><text x="1372" y="1804" class="node-body">Bad signature, malformed JSON, wrong vault</text><text x="1372" y="1829" class="node-body">or request ID, or invalid host stops</text><text x="1372" y="1854" class="node-body">replacement.</text><path d="M930.0,2059 L1150,2180.0 L930.0,2301 L710,2180.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="2128" text-anchor="middle" class="node-title">Snapshot valid?</text><text x="930.0" y="2158" text-anchor="middle" class="node-body">Check version, vault ID,</text><text x="930.0" y="2182" text-anchor="middle" class="node-body">echoed request ID, numeric</text><text x="930.0" y="2206" text-anchor="middle" class="node-body">time, revision, and every</text><text x="930.0" y="2230" text-anchor="middle" class="node-body">host with unique IDs.</text><rect x="1350" y="2059" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="2095" class="node-title">Keep prior state</text><text x="1372" y="2128" class="node-body">Old revision or invalid host is rejected.</text><text x="1372" y="2153" class="node-body">Equal revision is allowed with a fresh</text><text x="1372" y="2178" class="node-body">request ID; time is not an expiry.</text><rect x="710" y="2383" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="2419" class="node-title">Replace one saved value</text><text x="732" y="2452" class="node-body">Store pairing, revision, and the entire</text><text x="732" y="2477" class="node-body">host snapshot together. The phone host list</text><text x="732" y="2502" class="node-body">is read-only.</text><rect x="1350" y="2383" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="2419" class="node-title">Immediate error shown</text><text x="1372" y="2452" class="node-body">One logical value avoids split pairing/host</text><text x="1372" y="2477" class="node-body">updates. Later disk-write failure may not</text><text x="1372" y="2502" class="node-body">be reported; crash durability is unproven.</text><rect x="710" y="2616" width="440" height="126" rx="3" fill="#222529" stroke="#81a991" stroke-width="2"/><text x="732" y="2652" class="node-title">Show new host list</text><text x="732" y="2685" class="node-body">The new full copy includes removals. There</text><text x="732" y="2710" class="node-body">is no phone-to-desktop host edit endpoint.</text></svg>