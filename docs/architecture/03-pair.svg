<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="3832" viewBox="0 0 1860 3832" role="img" aria-labelledby="title desc">
<title id="title">03 / Pair one Android phone</title><desc id="desc">A short-lived QR secret starts the exchange. The person approves only after comparing both displayed codes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8d969b"/></marker></defs>
<style>
    text{font-family:Arial,DejaVu Sans,sans-serif;fill:#f2f3f3}
    .page-title{font-size:34px;font-weight:700}
    .section-title{font-size:30px;font-weight:700}
    .summary{font-size:19px;fill:#bdc3c6}
    .lane{font-size:18px;font-weight:700;letter-spacing:1px;fill:#bdc3c6}
    .node-title{font-size:21px;font-weight:700}
    .node-body{font-size:18px}
    .edge{font-size:16px;font-weight:700;fill:#f2f3f3}
    </style><rect width="1860" height="3832" fill="#17191c"/><text x="70" y="72" class="section-title">03 / Pair one Android phone</text><text x="70" y="110" class="summary">A short-lived QR secret starts the exchange. The person approves only after comparing both displayed codes.</text><text x="70" y="172" class="lane">DESKTOP</text><path d="M70,185 h440" stroke="#8d969b" stroke-width="1"/><text x="710" y="172" class="lane">ANDROID</text><path d="M710,185 h440" stroke="#8d969b" stroke-width="1"/><text x="1350" y="172" class="lane">CHECK / RESULT</text><path d="M1350,185 h440" stroke="#8d969b" stroke-width="1"/><path d="M510,293.5 L1350,293.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="876.1" y="267.5" width="107.7" height="23" fill="#17191c"/><text x="930.0" y="284.5" text-anchor="middle" class="edge">start fails</text><path d="M290.0,369.0 L290.0,451.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="235.1" y="398.0" width="133.8" height="23" fill="#17191c"/><text x="302.0" y="415.0" text-anchor="middle" class="edge">listener ready</text><path d="M290.0,602.0 L290.0,657.0 L930.0,657.0 L930.0,684.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="573.5" y="631.0" width="72.9" height="23" fill="#17191c"/><text x="610.0" y="648.0" text-anchor="middle" class="edge">QR JSON</text><path d="M930.0,835.0 L930.0,917.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="892.5" y="864.0" width="99.0" height="23" fill="#17191c"/><text x="942.0" y="881.0" text-anchor="middle" class="edge">invitation</text><path d="M1150,1052.0 L1350,992.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="966.5" width="38.0" height="23" fill="#17191c"/><text x="1250.0" y="983.5" text-anchor="middle" class="edge">No</text><path d="M930.0,1187.0 L930.0,1269.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="923.0" y="1216.0" width="38.1" height="23" fill="#17191c"/><text x="942.0" y="1233.0" text-anchor="middle" class="edge">Yes</text><path d="M930.0,1445.0 L930.0,1500.0 L290.0,1500.0 L290.0,1527.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="508.3" y="1474.0" width="203.4" height="23" fill="#17191c"/><text x="610.0" y="1491.0" text-anchor="middle" class="edge">POST /v1/pair/{pairId}</text><path d="M510,1602.5 L1350,1602.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="850.0" y="1576.5" width="159.9" height="23" fill="#17191c"/><text x="930.0" y="1593.5" text-anchor="middle" class="edge">invalid / claimed</text><path d="M290.0,1678.0 L290.0,1733.0 L930.0,1733.0 L930.0,1760.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="556.1" y="1707.0" width="107.7" height="23" fill="#17191c"/><text x="610.0" y="1724.0" text-anchor="middle" class="edge">202 pending</text><path d="M710,1835.5 L510,1867.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="547.5" y="1809.5" width="125.1" height="23" fill="#17191c"/><text x="610.0" y="1826.5" text-anchor="middle" class="edge">user compares</text><path d="M290.0,1974.0 L290.0,1999.0 L1570.0,1999.0 L1570.0,2056.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="719.0" y="1973.0" width="38.0" height="23" fill="#17191c"/><text x="738.0" y="1990.0" text-anchor="middle" class="edge">No</text><path d="M290.0,1974.0 L290.0,2056.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="282.9" y="2003.0" width="38.1" height="23" fill="#17191c"/><text x="302.0" y="2020.0" text-anchor="middle" class="edge">Yes</text><path d="M290.0,2207.0 L290.0,2262.0 L930.0,2262.0 L930.0,2289.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="538.8" y="2236.0" width="142.5" height="23" fill="#17191c"/><text x="610.0" y="2253.0" text-anchor="middle" class="edge">sealed sync key</text><path d="M1150,2364.5 L1350,2364.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1213.5" y="2338.5" width="72.9" height="23" fill="#17191c"/><text x="1250.0" y="2355.5" text-anchor="middle" class="edge">invalid</text><path d="M930.0,2440.0 L930.0,2522.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="901.2" y="2469.0" width="81.6" height="23" fill="#17191c"/><text x="942.0" y="2486.0" text-anchor="middle" class="edge">accepted</text><path d="M1150,2629.0 L1350,2597.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="2571.5" width="38.1" height="23" fill="#17191c"/><text x="1250.0" y="2588.5" text-anchor="middle" class="edge">Yes</text><path d="M930.0,2736.0 L930.0,2818.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="923.0" y="2765.0" width="38.0" height="23" fill="#17191c"/><text x="942.0" y="2782.0" text-anchor="middle" class="edge">No</text><path d="M1570.0,2673.0 L1570.0,2818.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1510.8" y="2733.5" width="142.5" height="23" fill="#17191c"/><text x="1582.0" y="2750.5" text-anchor="middle" class="edge">no saved change</text><path d="M1570.0,2944.0 L1570.0,3024.0 L930.0,3024.0 L930.0,3051.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1165.7" y="2998.0" width="168.6" height="23" fill="#17191c"/><text x="1250.0" y="3015.0" text-anchor="middle" class="edge">new pairing in RAM</text><path d="M930.0,2969.0 L930.0,3051.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="875.1" y="2998.0" width="133.8" height="23" fill="#17191c"/><text x="942.0" y="3015.0" text-anchor="middle" class="edge">saved identity</text><path d="M930.0,3177.0 L930.0,3259.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="870.8" y="3206.0" width="142.5" height="23" fill="#17191c"/><text x="942.0" y="3223.0" text-anchor="middle" class="edge">signed snapshot</text><path d="M1150,3380.0 L1350,3334.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="3308.5" width="38.0" height="23" fill="#17191c"/><text x="1250.0" y="3325.5" text-anchor="middle" class="edge">No</text><path d="M930.0,3501.0 L930.0,3583.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="923.0" y="3530.0" width="38.1" height="23" fill="#17191c"/><text x="942.0" y="3547.0" text-anchor="middle" class="edge">Yes</text><rect x="70" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="254" class="node-title">Unlock and share</text><text x="92" y="287" class="node-body">Start the opt-in HTTP listener on port</text><text x="92" y="312" class="node-body">45873. The selected private IP is the QR</text><text x="92" y="337" class="node-body">address; the listener binds all interfaces.</text><rect x="1350" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="254" class="node-title">No invitation</text><text x="1372" y="287" class="node-body">Try another reachable network. Both current</text><text x="1372" y="312" class="node-body">UIs use port 45873; an occupied port stops</text><text x="1372" y="337" class="node-body">sharing.</text><rect x="70" y="451" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="487" class="node-title">Make a five-minute QR</text><text x="92" y="520" class="node-body">Include desktop URL, vault ID, one-use pair</text><text x="92" y="545" class="node-body">ID, random 32-byte secret, signing public</text><text x="92" y="570" class="node-body">key, and expiry.</text><rect x="710" y="684" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="720" class="node-title">Scan or paste QR</text><text x="732" y="753" class="node-body">Camera permission can be denied; paste is</text><text x="732" y="778" class="node-body">the fallback. The QR is secret and is</text><text x="732" y="803" class="node-body">copied only by explicit action.</text><path d="M930.0,917 L1150,1052.0 L930.0,1187 L710,1052.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="986" text-anchor="middle" class="node-title">Invitation valid?</text><text x="930.0" y="1016" text-anchor="middle" class="node-body">Check version, expiry,</text><text x="930.0" y="1040" text-anchor="middle" class="node-body">sizes, IDs, key and</text><text x="930.0" y="1064" text-anchor="middle" class="node-body">literal local IP URL. No</text><text x="930.0" y="1088" text-anchor="middle" class="node-body">DNS, public IP, or</text><text x="930.0" y="1112" text-anchor="middle" class="node-body">redirect.</text><rect x="1350" y="917" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="953" class="node-title">Stop pairing</text><text x="1372" y="986" class="node-body">Bad QR, cancellation, or unreachable</text><text x="1372" y="1011" class="node-body">desktop leaves the existing phone vault</text><text x="1372" y="1036" class="node-body">alone.</text><rect x="710" y="1269" width="440" height="176" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1305" class="node-title">Make encrypted request</text><text x="732" y="1338" class="node-body">Create device ID and random nonce. Make a</text><text x="732" y="1363" class="node-body">six-digit check number from them and the QR</text><text x="732" y="1388" class="node-body">secret (SHA-256). Seal with a pair-request</text><text x="732" y="1413" class="node-body">label.</text><rect x="70" y="1527" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1563" class="node-title">Bind first requester</text><text x="92" y="1596" class="node-body">Decrypt and check the request. The first</text><text x="92" y="1621" class="node-body">valid device ID and nonce own this</text><text x="92" y="1646" class="node-body">invitation; rate and socket limits apply.</text><rect x="1350" y="1527" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1563" class="node-title">Reject other claimant</text><text x="1372" y="1596" class="node-body">Another device, malformed message, or</text><text x="1372" y="1621" class="node-body">expired invitation cannot take over the</text><text x="1372" y="1646" class="node-body">pending approval.</text><rect x="710" y="1760" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1796" class="node-title">Wait with same request</text><text x="732" y="1829" class="node-body">Pending 202 or network timeout retries the</text><text x="732" y="1854" class="node-body">exact encrypted request every two seconds</text><text x="732" y="1879" class="node-body">until decision or QR expiry.</text><path d="M290.0,1760 L510,1867.0 L290.0,1974 L70,1867.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="290.0" y="1829" text-anchor="middle" class="node-title">Codes match?</text><text x="290.0" y="1859" text-anchor="middle" class="node-body">Compare the two screens.</text><text x="290.0" y="1883" text-anchor="middle" class="node-body">Approve on the desktop</text><text x="290.0" y="1907" text-anchor="middle" class="node-body">only when they match.</text><rect x="1350" y="2056" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="2092" class="node-title">Deny or expire</text><text x="1372" y="2125" class="node-body">Code mismatch: deny. Denied 403 or</text><text x="1372" y="2150" class="node-body">expired/canceled 410 ends pairing;</text><text x="1372" y="2175" class="node-body">dismissing desktop QR cancels it.</text><rect x="70" y="2056" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="2092" class="node-title">Save this phone's sync key</text><text x="92" y="2125" class="node-body">Create a new random 32-byte key for this</text><text x="92" y="2150" class="node-body">phone. Save the pairing in the encrypted</text><text x="92" y="2175" class="node-body">desktop vault first.</text><rect x="710" y="2289" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="2325" class="node-title">Check encrypted reply</text><text x="732" y="2358" class="node-body">Open with the QR secret and pair-response</text><text x="732" y="2383" class="node-body">label. Check IDs, desktop name, and sync</text><text x="732" y="2408" class="node-body">key; pin signing public key from QR.</text><rect x="1350" y="2289" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="2325" class="node-title">Reject bad reply</text><text x="1372" y="2358" class="node-body">Bad success reply stops pairing; scan a new</text><text x="1372" y="2383" class="node-body">QR. A lost network response can retry the</text><text x="1372" y="2408" class="node-body">same bound request until expiry.</text><path d="M930.0,2522 L1150,2629.0 L930.0,2736 L710,2629.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="2591" text-anchor="middle" class="node-title">Already paired?</text><text x="930.0" y="2621" text-anchor="middle" class="node-body">Choose the first-pair or</text><text x="930.0" y="2645" text-anchor="middle" class="node-body">replacement path before</text><text x="930.0" y="2669" text-anchor="middle" class="node-body">saving phone state.</text><rect x="1350" y="2522" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="2558" class="node-title">Stage replacement</text><text x="1372" y="2591" class="node-body">Keep the approved new pairing in memory.</text><text x="1372" y="2616" class="node-body">Old saved pairing and hosts stay until the</text><text x="1372" y="2641" class="node-body">new snapshot passes.</text><rect x="710" y="2818" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="2854" class="node-title">Save first pairing</text><text x="732" y="2887" class="node-body">Save identity with an empty host copy. If</text><text x="732" y="2912" class="node-body">first sync fails, this pairing remains for</text><text x="732" y="2937" class="node-body">a retry.</text><rect x="1350" y="2818" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="2854" class="node-title">Use staged key</text><text x="1372" y="2887" class="node-body">Request the new snapshot with the approved</text><text x="1372" y="2912" class="node-body">key still held only in phone memory.</text><rect x="710" y="3051" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="3087" class="node-title">Fetch first snapshot</text><text x="732" y="3120" class="node-body">Use the new sync key to request, decrypt,</text><text x="732" y="3145" class="node-body">and verify a full signed host snapshot.</text><path d="M930.0,3259 L1150,3380.0 L930.0,3501 L710,3380.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="3328" text-anchor="middle" class="node-title">First sync valid?</text><text x="930.0" y="3358" text-anchor="middle" class="node-body">Check signature, IDs,</text><text x="930.0" y="3382" text-anchor="middle" class="node-body">revision, and every host</text><text x="930.0" y="3406" text-anchor="middle" class="node-body">before replacing a saved</text><text x="930.0" y="3430" text-anchor="middle" class="node-body">copy.</text><rect x="1350" y="3259" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="3295" class="node-title">Keep saved state</text><text x="1372" y="3328" class="node-body">First pair keeps its empty copy for retry.</text><text x="1372" y="3353" class="node-body">Replacement keeps the old pairing and</text><text x="1372" y="3378" class="node-body">hosts; pending memory can be lost.</text><rect x="710" y="3583" width="440" height="151" rx="3" fill="#222529" stroke="#81a991" stroke-width="2"/><text x="732" y="3619" class="node-title">Save verified snapshot</text><text x="732" y="3652" class="node-body">Replace the full host list. For a desktop</text><text x="732" y="3677" class="node-body">switch, save new pairing and snapshot</text><text x="732" y="3702" class="node-body">together in one value.</text></svg>