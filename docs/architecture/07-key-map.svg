<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="2489" viewBox="0 0 1860 2489" role="img" aria-labelledby="title desc">
<title id="title">07 / Which key does which job</title><desc id="desc">Read each row across. These keys serve different jobs; the rows are not a sequence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8d969b"/></marker></defs>
<style>
    text{font-family:Arial,DejaVu Sans,sans-serif;fill:#f2f3f3}
    .page-title{font-size:34px;font-weight:700}
    .section-title{font-size:30px;font-weight:700}
    .summary{font-size:19px;fill:#bdc3c6}
    .lane{font-size:18px;font-weight:700;letter-spacing:1px;fill:#bdc3c6}
    .node-title{font-size:21px;font-weight:700}
    .node-body{font-size:18px}
    .edge{font-size:16px;font-weight:700;fill:#f2f3f3}
    </style><rect width="1860" height="2489" fill="#17191c"/><text x="70" y="72" class="section-title">07 / Which key does which job</text><text x="70" y="110" class="summary">Read each row across. These keys serve different jobs; the rows are not a sequence.</text><text x="70" y="172" class="lane">OWNER / SOURCE</text><path d="M70,185 h440" stroke="#8d969b" stroke-width="1"/><text x="710" y="172" class="lane">JOB</text><path d="M710,185 h440" stroke="#8d969b" stroke-width="1"/><text x="1350" y="172" class="lane">HOLDER / LIMIT</text><path d="M1350,185 h440" stroke="#8d969b" stroke-width="1"/><path d="M510,268.5 L710,281.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="569.2" y="242.5" width="81.6" height="23" fill="#17191c"/><text x="610.0" y="259.5" text-anchor="middle" class="edge">encrypts</text><path d="M1150,281.0 L1350,268.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1217.9" y="242.5" width="64.2" height="23" fill="#17191c"/><text x="1250.0" y="259.5" text-anchor="middle" class="edge">holder</text><path d="M510,489.0 L710,489.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="569.2" y="463.0" width="81.6" height="23" fill="#17191c"/><text x="610.0" y="480.0" text-anchor="middle" class="edge">encrypts</text><path d="M1150,489.0 L1350,489.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1217.9" y="463.0" width="64.2" height="23" fill="#17191c"/><text x="1250.0" y="480.0" text-anchor="middle" class="edge">holder</text><path d="M510,709.5 L710,697.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="582.2" y="671.0" width="55.5" height="23" fill="#17191c"/><text x="610.0" y="688.0" text-anchor="middle" class="edge">opens</text><path d="M1150,697.0 L1350,697.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1217.9" y="671.0" width="64.2" height="23" fill="#17191c"/><text x="1250.0" y="688.0" text-anchor="middle" class="edge">holder</text><path d="M510,942.5 L710,942.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="582.2" y="916.5" width="55.5" height="23" fill="#17191c"/><text x="610.0" y="933.5" text-anchor="middle" class="edge">signs</text><path d="M1150,942.5 L1350,930.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1200.5" y="904.0" width="99.0" height="23" fill="#17191c"/><text x="1250.0" y="921.0" text-anchor="middle" class="edge">public key</text><path d="M510,1163.0 L710,1175.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="582.2" y="1137.0" width="55.5" height="23" fill="#17191c"/><text x="610.0" y="1154.0" text-anchor="middle" class="edge">seals</text><path d="M1150,1175.5 L1350,1175.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1209.2" y="1149.5" width="81.6" height="23" fill="#17191c"/><text x="1250.0" y="1166.5" text-anchor="middle" class="edge">lifetime</text><path d="M510,1396.0 L710,1396.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="582.2" y="1370.0" width="55.5" height="23" fill="#17191c"/><text x="610.0" y="1387.0" text-anchor="middle" class="edge">seals</text><path d="M1150,1396.0 L1350,1408.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1213.5" y="1370.0" width="72.9" height="23" fill="#17191c"/><text x="1250.0" y="1387.0" text-anchor="middle" class="edge">holders</text><path d="M510,1641.5 L710,1629.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="569.2" y="1603.0" width="81.6" height="23" fill="#17191c"/><text x="610.0" y="1620.0" text-anchor="middle" class="edge">compared</text><path d="M1150,1629.0 L1350,1629.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1213.5" y="1603.0" width="72.9" height="23" fill="#17191c"/><text x="1250.0" y="1620.0" text-anchor="middle" class="edge">holders</text><path d="M510,1874.5 L710,1874.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="547.5" y="1848.5" width="125.1" height="23" fill="#17191c"/><text x="610.0" y="1865.5" text-anchor="middle" class="edge">authenticates</text><path d="M1150,1874.5 L1350,1874.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1213.5" y="1848.5" width="72.9" height="23" fill="#17191c"/><text x="1250.0" y="1865.5" text-anchor="middle" class="edge">holders</text><path d="M510,2095.0 L710,2095.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="569.2" y="2069.0" width="81.6" height="23" fill="#17191c"/><text x="610.0" y="2086.0" text-anchor="middle" class="edge">encrypts</text><path d="M1150,2095.0 L1350,2095.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1209.2" y="2069.0" width="81.6" height="23" fill="#17191c"/><text x="1250.0" y="2086.0" text-anchor="middle" class="edge">lifetime</text><rect x="70" y="218" width="440" height="101" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="254" class="node-title">Mac vault key</text><text x="92" y="287" class="node-body">Random AES-256 key kept by macOS Keychain.</text><rect x="710" y="218" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="254" class="node-title">Seal Mac's file</text><text x="732" y="287" class="node-body">AES-GCM encrypts the local library and</text><text x="732" y="312" class="node-body">detects changes to its sealed bytes.</text><rect x="1350" y="218" width="440" height="101" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="254" class="node-title">Stays on Mac</text><text x="1372" y="287" class="node-body">Phone never receives this vault key.</text><rect x="70" y="426" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="462" class="node-title">Linux vault key</text><text x="92" y="495" class="node-body">A user passphrase and random salt make an</text><text x="92" y="520" class="node-body">AES-256 key using 600,000 PBKDF2 rounds.</text><rect x="710" y="426" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="462" class="node-title">Seal Linux's file</text><text x="732" y="495" class="node-body">This key encrypts the independent Linux</text><text x="732" y="520" class="node-body">vault.</text><rect x="1350" y="426" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="462" class="node-title">Stays on Linux</text><text x="1372" y="495" class="node-body">It is not the Mac key or a cross-desktop</text><text x="1372" y="520" class="node-body">sync key.</text><rect x="70" y="634" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="670" class="node-title">Phone storage keys</text><text x="92" y="703" class="node-body">The phone plugin makes a random AES-128</text><text x="92" y="728" class="node-body">data key; Android Keystore keeps the RSA</text><text x="92" y="753" class="node-body">wrapping key.</text><rect x="710" y="634" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="670" class="node-title">Seal the phone copy</text><text x="732" y="703" class="node-body">The wrapped AES key opens encrypted pairing</text><text x="732" y="728" class="node-body">and snapshot data on local disk.</text><rect x="1350" y="634" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="670" class="node-title">Stays on phone</text><text x="1372" y="703" class="node-body">These keys are not carried in the QR.</text><text x="1372" y="728" class="node-body">Screen unlock is a separate app gate.</text><rect x="70" y="867" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="903" class="node-title">Desktop signing key</text><text x="92" y="936" class="node-body">Ed25519 private key stays with that</text><text x="92" y="961" class="node-body">desktop. Its public half travels in the</text><text x="92" y="986" class="node-body">pairing QR.</text><rect x="710" y="867" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="903" class="node-title">Prove snapshot issuer</text><text x="732" y="936" class="node-body">A signature proves the exact snapshot bytes</text><text x="732" y="961" class="node-body">came from the paired desktop; it does not</text><text x="732" y="986" class="node-body">hide them.</text><rect x="1350" y="867" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="903" class="node-title">Phone pins public half</text><text x="1372" y="936" class="node-body">The phone checks signatures against the key</text><text x="1372" y="961" class="node-body">from the QR, never a new key sent by HTTP.</text><rect x="70" y="1100" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1136" class="node-title">Invitation secret</text><text x="92" y="1169" class="node-body">The QR carries a random 32-byte secret for</text><text x="92" y="1194" class="node-body">one invitation lasting five minutes.</text><rect x="710" y="1100" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1136" class="node-title">Seal first pair messages</text><text x="732" y="1169" class="node-body">Both sides use it for the pair request and</text><text x="732" y="1194" class="node-body">reply. The six-digit comparison code is not</text><text x="732" y="1219" class="node-body">a key.</text><rect x="1350" y="1100" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="1136" class="node-title">Temporary, both sides</text><text x="1372" y="1169" class="node-body">Keep QR private. An approved reply can be</text><text x="1372" y="1194" class="node-body">retried only by its bound request until</text><text x="1372" y="1219" class="node-body">expiry.</text><rect x="70" y="1333" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1369" class="node-title">Per-phone sync key</text><text x="92" y="1402" class="node-body">Desktop makes a different random 32-byte</text><text x="92" y="1427" class="node-body">key after approving each phone.</text><rect x="710" y="1333" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1369" class="node-title">Seal later sync bodies</text><text x="732" y="1402" class="node-body">AES-256-GCM encrypts and checks request and</text><text x="732" y="1427" class="node-body">response bodies for that phone.</text><rect x="1350" y="1333" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="1369" class="node-title">Desktop and phone</text><text x="1372" y="1402" class="node-body">Revoking deletes the desktop's copy,</text><text x="1372" y="1427" class="node-body">blocking new sync, not old offline</text><text x="1372" y="1452" class="node-body">credentials.</text><rect x="70" y="1566" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1602" class="node-title">SSH server public key</text><text x="92" y="1635" class="node-body">Desktop scans, person verifies its</text><text x="92" y="1660" class="node-body">fingerprint, then desktop saves the</text><text x="92" y="1685" class="node-body">approved key.</text><rect x="710" y="1566" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1602" class="node-title">Check destination</text><text x="732" y="1635" class="node-body">The synced pin identifies the SSH server</text><text x="732" y="1660" class="node-body">before Harbor gives user login proof.</text><rect x="1350" y="1566" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="1602" class="node-title">Desktop and phone</text><text x="1372" y="1635" class="node-body">This is the server's key, separate from the</text><text x="1372" y="1660" class="node-body">desktop signing key.</text><rect x="70" y="1799" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1835" class="node-title">SSH login secret</text><text x="92" y="1868" class="node-body">Password or original private key and</text><text x="92" y="1893" class="node-body">passphrase are saved in the encrypted host</text><text x="92" y="1918" class="node-body">record.</text><rect x="710" y="1799" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1835" class="node-title">Prove user access</text><text x="732" y="1868" class="node-body">Both clients may use it for SSH. A private</text><text x="732" y="1893" class="node-body">key signs proof; it is not uploaded to the</text><text x="732" y="1918" class="node-body">server.</text><rect x="1350" y="1799" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="1835" class="node-title">Copied to phone</text><text x="1372" y="1868" class="node-body">Server account policy decides permissions.</text><text x="1372" y="1893" class="node-body">Rotation at the server removes copied</text><text x="1372" y="1918" class="node-body">access.</text><rect x="70" y="2032" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="2068" class="node-title">SSH session keys</text><text x="92" y="2101" class="node-body">SSH negotiates new live channel keys</text><text x="92" y="2126" class="node-body">between client and server.</text><rect x="710" y="2032" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="2068" class="node-title">Encrypt terminal traffic</text><text x="732" y="2101" class="node-body">These keys protect interactive commands and</text><text x="732" y="2126" class="node-body">output while that SSH connection lasts.</text><rect x="1350" y="2032" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="2068" class="node-title">Only this SSH link</text><text x="1372" y="2101" class="node-body">They are separate from the vault,</text><text x="1372" y="2126" class="node-body">invitation, and sync keys.</text><rect x="70" y="2240" width="440" height="101" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="2276" class="node-title">Nonce</text><text x="92" y="2309" class="node-body">A fresh number for each AES-GCM seal.</text><rect x="710" y="2240" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="2276" class="node-title">Tag and purpose label</text><text x="732" y="2309" class="node-body">Tag detects tampering; the visible AAD</text><text x="732" y="2334" class="node-body">label ties a sealed message to its intended</text><text x="732" y="2359" class="node-body">use.</text><rect x="1350" y="2240" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="2276" class="node-title">Revision</text><text x="1372" y="2309" class="node-body">A rising host version counter. 'Atomic'</text><text x="1372" y="2334" class="node-body">means replace the complete saved value in</text><text x="1372" y="2359" class="node-body">one logical step.</text></svg>