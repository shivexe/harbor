<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="2713" viewBox="0 0 1860 2713" role="img" aria-labelledby="title desc">
<title id="title">02 / Save a host in the desktop vault</title><desc id="desc">Only an unlocked desktop edits host records. A failed check leaves the previous saved record in place.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8d969b"/></marker></defs>
<style>
    text{font-family:Arial,DejaVu Sans,sans-serif;fill:#f2f3f3}
    .page-title{font-size:34px;font-weight:700}
    .section-title{font-size:30px;font-weight:700}
    .summary{font-size:19px;fill:#bdc3c6}
    .lane{font-size:18px;font-weight:700;letter-spacing:1px;fill:#bdc3c6}
    .node-title{font-size:21px;font-weight:700}
    .node-body{font-size:18px}
    .edge{font-size:16px;font-weight:700;fill:#f2f3f3}
    </style><rect width="1860" height="2713" fill="#17191c"/><text x="70" y="72" class="section-title">02 / Save a host in the desktop vault</text><text x="70" y="110" class="summary">Only an unlocked desktop edits host records. A failed check leaves the previous saved record in place.</text><text x="70" y="172" class="lane">DESKTOP ACTION</text><path d="M70,185 h440" stroke="#8d969b" stroke-width="1"/><text x="710" y="172" class="lane">DATA / CHECK</text><path d="M710,185 h440" stroke="#8d969b" stroke-width="1"/><text x="1350" y="172" class="lane">FAILURE OR RESULT</text><path d="M1350,185 h440" stroke="#8d969b" stroke-width="1"/><path d="M290.0,369.0 L290.0,424.0 L930.0,424.0 L930.0,451.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="525.7" y="398.0" width="168.6" height="23" fill="#17191c"/><text x="610.0" y="415.0" text-anchor="middle" class="edge">decrypt + validate</text><path d="M1150,586.0 L1350,526.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="500.5" width="38.0" height="23" fill="#17191c"/><text x="1250.0" y="517.5" text-anchor="middle" class="edge">No</text><path d="M930.0,721.0 L930.0,776.0 L290.0,776.0 L290.0,803.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="591.0" y="750.0" width="38.1" height="23" fill="#17191c"/><text x="610.0" y="767.0" text-anchor="middle" class="edge">Yes</text><path d="M290.0,954.0 L290.0,1036.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="256.9" y="983.0" width="90.3" height="23" fill="#17191c"/><text x="302.0" y="1000.0" text-anchor="middle" class="edge">key login</text><path d="M290.0,954.0 L290.0,1009.0 L930.0,1009.0 L930.0,1036.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="538.8" y="983.0" width="142.5" height="23" fill="#17191c"/><text x="610.0" y="1000.0" text-anchor="middle" class="edge">password / none</text><path d="M290.0,1187.0 L290.0,1242.0 L930.0,1242.0 L930.0,1269.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="560.5" y="1216.0" width="99.0" height="23" fill="#17191c"/><text x="610.0" y="1233.0" text-anchor="middle" class="edge">host draft</text><path d="M930.0,1187.0 L930.0,1269.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="892.5" y="1216.0" width="99.0" height="23" fill="#17191c"/><text x="942.0" y="1233.0" text-anchor="middle" class="edge">host draft</text><path d="M1150,1404.0 L1350,1344.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="1318.5" width="38.0" height="23" fill="#17191c"/><text x="1250.0" y="1335.5" text-anchor="middle" class="edge">No</text><path d="M930.0,1539.0 L930.0,1594.0 L290.0,1594.0 L290.0,1621.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="591.0" y="1568.0" width="38.1" height="23" fill="#17191c"/><text x="610.0" y="1585.0" text-anchor="middle" class="edge">Yes</text><path d="M510,1709.0 L1350,1684.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="876.1" y="1658.0" width="107.7" height="23" fill="#17191c"/><text x="930.0" y="1675.0" text-anchor="middle" class="edge">write fails</text><path d="M290.0,1797.0 L290.0,1879.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="235.1" y="1826.0" width="133.8" height="23" fill="#17191c"/><text x="302.0" y="1843.0" text-anchor="middle" class="edge">write succeeds</text><path d="M510,1954.5 L1350,1954.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="880.5" y="1928.5" width="99.0" height="23" fill="#17191c"/><text x="930.0" y="1945.5" text-anchor="middle" class="edge">later lock</text><path d="M290.0,2030.0 L290.0,2085.0 L930.0,2085.0 L930.0,2112.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="560.5" y="2059.0" width="99.0" height="23" fill="#17191c"/><text x="610.0" y="2076.0" text-anchor="middle" class="edge">before SSH</text><path d="M1150,2247.0 L1350,2187.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="2161.5" width="38.0" height="23" fill="#17191c"/><text x="1250.0" y="2178.5" text-anchor="middle" class="edge">No</text><path d="M930.0,2382.0 L930.0,2437.0 L290.0,2437.0 L290.0,2464.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="591.0" y="2411.0" width="38.1" height="23" fill="#17191c"/><text x="610.0" y="2428.0" text-anchor="middle" class="edge">Yes</text><rect x="70" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="254" class="node-title">Open the vault</text><text x="92" y="287" class="node-body">Mac confirms the device owner, then gets</text><text x="92" y="312" class="node-body">its AES-256 key from Keychain. Linux</text><text x="92" y="337" class="node-body">derives one from a passphrase.</text><path d="M930.0,451 L1150,586.0 L930.0,721 L710,586.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="520" text-anchor="middle" class="node-title">Vault opens?</text><text x="930.0" y="550" text-anchor="middle" class="node-body">Decrypt the whole library</text><text x="930.0" y="574" text-anchor="middle" class="node-body">and check its records.</text><text x="930.0" y="598" text-anchor="middle" class="node-body">Each new vault gets its</text><text x="930.0" y="622" text-anchor="middle" class="node-body">own identity and signing</text><text x="930.0" y="646" text-anchor="middle" class="node-body">key.</text><rect x="1350" y="451" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="487" class="node-title">Stay locked</text><text x="1372" y="520" class="node-body">Denied unlock, wrong passphrase, missing</text><text x="1372" y="545" class="node-body">Mac key, corrupt data, or a second owner</text><text x="1372" y="570" class="node-body">stops the operation.</text><rect x="70" y="803" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="839" class="node-title">Enter host settings</text><text x="92" y="872" class="node-body">Set address, port, SSH user, name, group,</text><text x="92" y="897" class="node-body">notes, and password, private key, or no</text><text x="92" y="922" class="node-body">saved credential.</text><rect x="70" y="1036" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1072" class="node-title">Import a private key</text><text x="92" y="1105" class="node-body">File and paste accept up to 256 KiB. Keep</text><text x="92" y="1130" class="node-body">encrypted text. Linux bounds PBKDF2 to 2m</text><text x="92" y="1155" class="node-body">rounds; Mac checks PEM within 3 seconds.</text><rect x="710" y="1036" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1072" class="node-title">Password or none</text><text x="732" y="1105" class="node-body">Password needs a value. None saves no</text><text x="732" y="1130" class="node-body">password, key, or passphrase; server policy</text><text x="732" y="1155" class="node-body">must authorize login.</text><path d="M930.0,1269 L1150,1404.0 L930.0,1539 L710,1404.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="1338" text-anchor="middle" class="node-title">Record valid?</text><text x="930.0" y="1368" text-anchor="middle" class="node-body">Check address, port</text><text x="930.0" y="1392" text-anchor="middle" class="node-body">1–65535, username,</text><text x="930.0" y="1416" text-anchor="middle" class="node-body">selected login method,</text><text x="930.0" y="1440" text-anchor="middle" class="node-body">size, and private-key</text><text x="930.0" y="1464" text-anchor="middle" class="node-body">format before Save.</text><rect x="1350" y="1269" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1305" class="node-title">Keep the draft</text><text x="1372" y="1338" class="node-body">A rejected key, size limit, cancel, or lock</text><text x="1372" y="1363" class="node-body">leaves the saved host. Mac OpenSSH</text><text x="1372" y="1388" class="node-body">passphrase failure may appear at SSH.</text><rect x="70" y="1621" width="440" height="176" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1657" class="node-title">Encrypt and replace</text><text x="92" y="1690" class="node-body">Discard unused credential fields. Increase</text><text x="92" y="1715" class="node-body">revision inside the library, encrypt it,</text><text x="92" y="1740" class="node-body">then atomically replace the owner-only</text><text x="92" y="1765" class="node-body">file.</text><rect x="1350" y="1621" width="440" height="126" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1657" class="node-title">Old file remains</text><text x="1372" y="1690" class="node-body">A disk or permission failure stops the</text><text x="1372" y="1715" class="node-body">save; the previous persisted host remains.</text><rect x="70" y="1879" width="440" height="151" rx="3" fill="#222529" stroke="#81a991" stroke-width="2"/><text x="92" y="1915" class="node-title">New version is saved</text><text x="92" y="1948" class="node-body">Host add, edit, delete, or trusted-key</text><text x="92" y="1973" class="node-body">change raises the revision, a version</text><text x="92" y="1998" class="node-body">counter, in that encrypted save.</text><rect x="1350" y="1879" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="1915" class="node-title">Lock ends active work</text><text x="1372" y="1948" class="node-body">Mac locks on screen lock or 15 idle</text><text x="1372" y="1973" class="node-body">minutes. Linux locks when asked. Both stop</text><text x="1372" y="1998" class="node-body">sharing and SSH sessions.</text><path d="M930.0,2112 L1150,2247.0 L930.0,2382 L710,2247.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="2181" text-anchor="middle" class="node-title">Trust server key?</text><text x="930.0" y="2211" text-anchor="middle" class="node-body">A scan shows a</text><text x="930.0" y="2235" text-anchor="middle" class="node-body">fingerprint: a short</text><text x="930.0" y="2259" text-anchor="middle" class="node-body">identifier for the server</text><text x="930.0" y="2283" text-anchor="middle" class="node-body">key. The person compares</text><text x="930.0" y="2307" text-anchor="middle" class="node-body">it elsewhere and approves.</text><rect x="1350" y="2112" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="2148" class="node-title">No automatic trust</text><text x="1372" y="2181" class="node-body">A scan alone never proves identity. An</text><text x="1372" y="2206" class="node-body">unverified host may sync, but Android will</text><text x="1372" y="2231" class="node-body">refuse its SSH connection.</text><rect x="70" y="2464" width="440" height="151" rx="3" fill="#222529" stroke="#81a991" stroke-width="2"/><text x="92" y="2500" class="node-title">Save approved key</text><text x="92" y="2533" class="node-body">Store the full server public key. Address</text><text x="92" y="2558" class="node-body">or port changes clear trust and require</text><text x="92" y="2583" class="node-body">another check.</text></svg>