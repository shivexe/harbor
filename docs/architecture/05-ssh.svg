<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="3350" viewBox="0 0 1860 3350" role="img" aria-labelledby="title desc">
<title id="title">05 / Open a direct SSH terminal</title><desc id="desc">Harbor checks the server before giving login proof. A terminal appears only after the remote shell opens.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8d969b"/></marker></defs>
<style>
    text{font-family:Arial,DejaVu Sans,sans-serif;fill:#f2f3f3}
    .page-title{font-size:34px;font-weight:700}
    .section-title{font-size:30px;font-weight:700}
    .summary{font-size:19px;fill:#bdc3c6}
    .lane{font-size:18px;font-weight:700;letter-spacing:1px;fill:#bdc3c6}
    .node-title{font-size:21px;font-weight:700}
    .node-body{font-size:18px}
    .edge{font-size:16px;font-weight:700;fill:#f2f3f3}
    </style><rect width="1860" height="3350" fill="#17191c"/><text x="70" y="72" class="section-title">05 / Open a direct SSH terminal</text><text x="70" y="110" class="summary">Harbor checks the server before giving login proof. A terminal appears only after the remote shell opens.</text><text x="70" y="172" class="lane">HARBOR CLIENT</text><path d="M70,185 h440" stroke="#8d969b" stroke-width="1"/><text x="710" y="172" class="lane">SSH SERVER</text><path d="M710,185 h440" stroke="#8d969b" stroke-width="1"/><text x="1350" y="172" class="lane">STOP / RESULT</text><path d="M1350,185 h440" stroke="#8d969b" stroke-width="1"/><path d="M510,293.5 L1350,293.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="897.9" y="267.5" width="64.2" height="23" fill="#17191c"/><text x="930.0" y="284.5" text-anchor="middle" class="edge">no pin</text><path d="M290.0,369.0 L290.0,451.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="222.1" y="398.0" width="159.9" height="23" fill="#17191c"/><text x="302.0" y="415.0" text-anchor="middle" class="edge">trusted pin saved</text><path d="M510,539.0 L1350,526.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="884.9" y="500.5" width="90.3" height="23" fill="#17191c"/><text x="930.0" y="517.5" text-anchor="middle" class="edge">key fails</text><path d="M290.0,627.0 L290.0,709.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="209.0" y="656.0" width="186.0" height="23" fill="#17191c"/><text x="302.0" y="673.0" text-anchor="middle" class="edge">login material ready</text><path d="M510,797.0 L1350,784.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="867.5" y="758.5" width="125.1" height="23" fill="#17191c"/><text x="930.0" y="775.5" text-anchor="middle" class="edge">connect fails</text><path d="M290.0,885.0 L290.0,940.0 L930.0,940.0 L930.0,967.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="547.5" y="914.0" width="125.1" height="23" fill="#17191c"/><text x="610.0" y="931.0" text-anchor="middle" class="edge">SSH handshake</text><path d="M930.0,1093.0 L930.0,1148.0 L290.0,1148.0 L290.0,1175.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="530.0" y="1122.0" width="159.9" height="23" fill="#17191c"/><text x="610.0" y="1139.0" text-anchor="middle" class="edge">server public key</text><path d="M510,1296.0 L1350,1250.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="911.0" y="1224.5" width="38.0" height="23" fill="#17191c"/><text x="930.0" y="1241.5" text-anchor="middle" class="edge">No</text><path d="M290.0,1417.0 L290.0,1499.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="282.9" y="1446.0" width="38.1" height="23" fill="#17191c"/><text x="302.0" y="1463.0" text-anchor="middle" class="edge">Yes</text><path d="M510,1599.5 L710,1574.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="556.1" y="1548.5" width="107.7" height="23" fill="#17191c"/><text x="610.0" y="1565.5" text-anchor="middle" class="edge">login proof</text><path d="M1150,1574.5 L1350,1574.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1217.9" y="1548.5" width="64.2" height="23" fill="#17191c"/><text x="1250.0" y="1565.5" text-anchor="middle" class="edge">denied</text><path d="M930.0,1650.0 L930.0,1755.0 L290.0,1755.0 L290.0,1782.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="569.2" y="1729.0" width="81.6" height="23" fill="#17191c"/><text x="610.0" y="1746.0" text-anchor="middle" class="edge">accepted</text><path d="M510,1845.0 L710,1903.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="556.1" y="1819.0" width="107.7" height="23" fill="#17191c"/><text x="610.0" y="1836.0" text-anchor="middle" class="edge">PTY + shell</text><path d="M1150,1903.0 L1350,1845.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1231.0" y="1819.0" width="38.0" height="23" fill="#17191c"/><text x="1250.0" y="1836.0" text-anchor="middle" class="edge">No</text><path d="M930.0,2024.0 L930.0,2079.0 L290.0,2079.0 L290.0,2106.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="591.0" y="2053.0" width="38.1" height="23" fill="#17191c"/><text x="610.0" y="2070.0" text-anchor="middle" class="edge">Yes</text><path d="M510,2181.5 L710,2181.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="564.9" y="2155.5" width="90.3" height="23" fill="#17191c"/><text x="610.0" y="2172.5" text-anchor="middle" class="edge">SSH input</text><path d="M930.0,2257.0 L930.0,2312.0 L290.0,2312.0 L290.0,2339.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="560.5" y="2286.0" width="99.0" height="23" fill="#17191c"/><text x="610.0" y="2303.0" text-anchor="middle" class="edge">SSH output</text><path d="M510,2414.5 L1350,2414.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="841.4" y="2388.5" width="177.3" height="23" fill="#17191c"/><text x="930.0" y="2405.5" text-anchor="middle" class="edge">nested shell output</text><path d="M290.0,2490.0 L290.0,2572.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="239.4" y="2519.0" width="125.1" height="23" fill="#17191c"/><text x="302.0" y="2536.0" text-anchor="middle" class="edge">session event</text><path d="M290.0,2786.0 L290.0,2841.0 L930.0,2841.0 L930.0,2868.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="551.8" y="2815.0" width="116.4" height="23" fill="#17191c"/><text x="610.0" y="2832.0" text-anchor="middle" class="edge">session done</text><path d="M290.0,2786.0 L290.0,2811.0 L1570.0,2811.0 L1570.0,2868.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="666.8" y="2785.0" width="142.5" height="23" fill="#17191c"/><text x="738.0" y="2802.0" text-anchor="middle" class="edge">transport error</text><path d="M930.0,2994.0 L930.0,3101.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="879.5" y="3035.5" width="125.1" height="23" fill="#17191c"/><text x="942.0" y="3052.5" text-anchor="middle" class="edge">ended session</text><path d="M1570.0,3019.0 L1570.0,3074.0 L930.0,3074.0 L930.0,3101.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1178.8" y="3048.0" width="142.5" height="23" fill="#17191c"/><text x="1250.0" y="3065.0" text-anchor="middle" class="edge">close resources</text><rect x="70" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="254" class="node-title">Choose a saved host</text><text x="92" y="287" class="node-body">Desktop uses its editable record; phone</text><text x="92" y="312" class="node-body">uses its read-only copy. Both need a</text><text x="92" y="337" class="node-body">network route to the server.</text><rect x="1350" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="254" class="node-title">No trusted server key</text><text x="1372" y="287" class="node-body">Desktop must scan, compare, and approve the</text><text x="1372" y="312" class="node-body">server key. Android needs a later sync of</text><text x="1372" y="337" class="node-body">that key.</text><rect x="70" y="451" width="440" height="176" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="487" class="node-title">Prepare login material</text><text x="92" y="520" class="node-body">Phone parses a saved encrypted key in</text><text x="92" y="545" class="node-body">memory before the socket. Desktop stages</text><text x="92" y="570" class="node-body">its original key for OpenSSH to unlock</text><text x="92" y="595" class="node-body">during login.</text><rect x="1350" y="451" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="487" class="node-title">Keep encrypted original</text><text x="1372" y="520" class="node-body">Phone rejects a wrong or unsupported key</text><text x="1372" y="545" class="node-body">before network login. Key work runs off the</text><text x="1372" y="570" class="node-body">UI: PBKDF2 ≤2m, bcrypt ≤1024 rounds.</text><rect x="70" y="709" width="440" height="176" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="745" class="node-title">Open SSH transport</text><text x="92" y="778" class="node-body">Phone dartssh2 opens TCP. Desktop OpenSSH</text><text x="92" y="803" class="node-body">uses safe arguments, a private known-hosts</text><text x="92" y="828" class="node-body">file, and no inherited user config or agent</text><text x="92" y="853" class="node-body">keys.</text><rect x="1350" y="709" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="745" class="node-title">Timeout or disconnect</text><text x="1372" y="778" class="node-body">Phone socket and handshake each have</text><text x="1372" y="803" class="node-body">15-second limits. Report an error; the</text><text x="1372" y="828" class="node-body">saved host remains.</text><rect x="710" y="967" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1003" class="node-title">Present server key</text><text x="732" y="1036" class="node-body">SSH setup returns the server's public key</text><text x="732" y="1061" class="node-body">before Harbor supplies user login proof.</text><path d="M290.0,1175 L510,1296.0 L290.0,1417 L70,1296.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="290.0" y="1244" text-anchor="middle" class="node-title">Server key matches?</text><text x="290.0" y="1274" text-anchor="middle" class="node-body">Compare its full key or</text><text x="290.0" y="1298" text-anchor="middle" class="node-body">SHA-256 fingerprint with</text><text x="290.0" y="1322" text-anchor="middle" class="node-body">the saved trusted key.</text><text x="290.0" y="1346" text-anchor="middle" class="node-body">Reject a changed identity.</text><rect x="1350" y="1175" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1211" class="node-title">Stop before login</text><text x="1372" y="1244" class="node-body">A mismatch needs explicit desktop</text><text x="1372" y="1269" class="node-body">re-verification and sync. Harbor does not</text><text x="1372" y="1294" class="node-body">accept it on sight.</text><rect x="70" y="1499" width="440" height="201" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1535" class="node-title">Prove user access</text><text x="92" y="1568" class="node-body">Password travels inside SSH; key signs</text><text x="92" y="1593" class="node-body">proof. None uses server policy without</text><text x="92" y="1618" class="node-body">fallback. Mac Keychain or Linux socket</text><text x="92" y="1643" class="node-body">helper gives desktop secrets here, never in</text><text x="92" y="1668" class="node-body">arguments or environment.</text><rect x="710" y="1499" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1535" class="node-title">Check user proof</text><text x="732" y="1568" class="node-body">The remote account accepts or denies the</text><text x="732" y="1593" class="node-body">login. Its permissions control what</text><text x="732" y="1618" class="node-body">commands can change.</text><rect x="1350" y="1499" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1535" class="node-title">Login rejected</text><text x="1372" y="1568" class="node-body">Wrong secret, denied account, or the</text><text x="1372" y="1593" class="node-body">phone's 30-second login timeout ends the</text><text x="1372" y="1618" class="node-body">attempt before any shell opens.</text><rect x="70" y="1782" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1818" class="node-title">Request remote shell</text><text x="92" y="1851" class="node-body">Ask for a PTY: a remote terminal window.</text><text x="92" y="1876" class="node-body">Phone waits up to 15 seconds for the shell.</text><path d="M930.0,1782 L1150,1903.0 L930.0,2024 L710,1903.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="930.0" y="1851" text-anchor="middle" class="node-title">Shell accepted?</text><text x="930.0" y="1881" text-anchor="middle" class="node-body">Only successful SSH</text><text x="930.0" y="1905" text-anchor="middle" class="node-body">authentication and an</text><text x="930.0" y="1929" text-anchor="middle" class="node-body">opened shell make the</text><text x="930.0" y="1953" text-anchor="middle" class="node-body">terminal ready.</text><rect x="1350" y="1782" width="440" height="126" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1818" class="node-title">Show error</text><text x="1372" y="1851" class="node-body">Refusal or timeout keeps the terminal out</text><text x="1372" y="1876" class="node-body">of the connected state.</text><rect x="70" y="2106" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="2142" class="node-title">Send typed input</text><text x="92" y="2175" class="node-body">Keystrokes and terminal size updates travel</text><text x="92" y="2200" class="node-body">inside the SSH encrypted channel. No sync</text><text x="92" y="2225" class="node-body">server relays them.</text><rect x="710" y="2106" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="2142" class="node-title">Run command</text><text x="732" y="2175" class="node-body">The SSH server interprets the text under</text><text x="732" y="2200" class="node-body">that account's permissions; read-only host</text><text x="732" y="2225" class="node-body">settings do not limit shell power.</text><rect x="70" y="2339" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="2375" class="node-title">Render returned output</text><text x="92" y="2408" class="node-body">Display bounded server text. No automatic</text><text x="92" y="2433" class="node-body">link or OSC52 clipboard action; explicit</text><text x="92" y="2458" class="node-body">terminal Copy is still available.</text><rect x="1350" y="2339" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="2375" class="node-title">Nested shell exits</text><text x="1372" y="2408" class="node-body">This is ordinary terminal output. Harbor</text><text x="1372" y="2433" class="node-body">stays connected while the main SSH shell</text><text x="1372" y="2458" class="node-body">runs; Back may keep it open.</text><path d="M290.0,2572 L510,2679.0 L290.0,2786 L70,2679.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="290.0" y="2641" text-anchor="middle" class="node-title">What event arrived?</text><text x="290.0" y="2671" text-anchor="middle" class="node-body">The main SSH session</text><text x="290.0" y="2695" text-anchor="middle" class="node-body">finishes, or the transport</text><text x="290.0" y="2719" text-anchor="middle" class="node-body">reports a failure?</text><rect x="710" y="2868" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="2904" class="node-title">Main shell exits</text><text x="732" y="2937" class="node-body">Remove only the ended session. Other active</text><text x="732" y="2962" class="node-body">terminals remain available.</text><rect x="1350" y="2868" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="2904" class="node-title">Transport fails</text><text x="1372" y="2937" class="node-body">Close this session and offer Retry or Edit.</text><text x="1372" y="2962" class="node-body">Phone Edit means desktop change, Sync, then</text><text x="1372" y="2987" class="node-body">Retry.</text><rect x="710" y="3101" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="3137" class="node-title">Release session material</text><text x="732" y="3170" class="node-body">Manual Close or lock closes SSH. Desktop</text><text x="732" y="3195" class="node-body">removes temporary 0600 key files from</text><text x="732" y="3220" class="node-body">private 0700 directories.</text></svg>