<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1166" viewBox="0 0 1860 1166" role="img" aria-labelledby="title desc">
<title id="title">01 / Who owns each copy</title><desc id="desc">The desktop is the master address book. The phone carries a sealed copy; the SSH server is the destination.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8d969b"/></marker></defs>
<style>
    text{font-family:Arial,DejaVu Sans,sans-serif;fill:#f2f3f3}
    .page-title{font-size:34px;font-weight:700}
    .section-title{font-size:30px;font-weight:700}
    .summary{font-size:19px;fill:#bdc3c6}
    .lane{font-size:18px;font-weight:700;letter-spacing:1px;fill:#bdc3c6}
    .node-title{font-size:21px;font-weight:700}
    .node-body{font-size:18px}
    .edge{font-size:16px;font-weight:700;fill:#f2f3f3}
    </style><rect width="1860" height="1166" fill="#17191c"/><text x="70" y="72" class="section-title">01 / Who owns each copy</text><text x="70" y="110" class="summary">The desktop is the master address book. The phone carries a sealed copy; the SSH server is the destination.</text><text x="70" y="172" class="lane">DESKTOP OWNER</text><path d="M70,185 h440" stroke="#8d969b" stroke-width="1"/><text x="710" y="172" class="lane">ANDROID PHONE</text><path d="M710,185 h440" stroke="#8d969b" stroke-width="1"/><text x="1350" y="172" class="lane">BOUNDARY / SERVER</text><path d="M1350,185 h440" stroke="#8d969b" stroke-width="1"/><path d="M510,293.5 L1350,293.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="858.8" y="267.5" width="142.5" height="23" fill="#17191c"/><text x="930.0" y="284.5" text-anchor="middle" class="edge">ownership limit</text><path d="M290.0,369.0 L290.0,424.0 L930.0,424.0 L930.0,451.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="486.6" y="398.0" width="246.9" height="23" fill="#17191c"/><text x="610.0" y="415.0" text-anchor="middle" class="edge">signed, encrypted HTTP sync</text><path d="M290.0,369.0 L290.0,684.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="252.5" y="514.5" width="99.0" height="23" fill="#17191c"/><text x="302.0" y="531.5" text-anchor="middle" class="edge">saved host</text><path d="M930.0,602.0 L930.0,684.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="892.5" y="631.0" width="99.0" height="23" fill="#17191c"/><text x="942.0" y="648.0" text-anchor="middle" class="edge">saved host</text><path d="M290.0,835.0 L290.0,860.0 L1570.0,860.0 L1570.0,917.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="679.8" y="834.0" width="116.4" height="23" fill="#17191c"/><text x="738.0" y="851.0" text-anchor="middle" class="edge">SSH commands</text><path d="M930.0,835.0 L930.0,890.0 L1570.0,890.0 L1570.0,917.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1191.8" y="864.0" width="116.4" height="23" fill="#17191c"/><text x="1250.0" y="881.0" text-anchor="middle" class="edge">SSH commands</text><rect x="70" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="254" class="node-title">One desktop owns hosts</text><text x="92" y="287" class="node-body">Mac uses SwiftUI, SwiftTerm and OpenSSH.</text><text x="92" y="312" class="node-body">Linux uses Qt, QTermWidget and OpenSSH with</text><text x="92" y="337" class="node-body">its own vault identity.</text><rect x="1350" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="254" class="node-title">No desktop merge</text><text x="1372" y="287" class="node-body">Mac and Linux do not copy or combine their</text><text x="1372" y="312" class="node-body">vaults. Harbor has no hosted account or</text><text x="1372" y="337" class="node-body">cloud relay.</text><rect x="710" y="451" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="487" class="node-title">Phone receives a copy</text><text x="732" y="520" class="node-body">Flutter, xterm and dartssh2 run the phone.</text><text x="732" y="545" class="node-body">Manual sync copies hosts and credentials;</text><text x="732" y="570" class="node-body">phone cannot edit host settings.</text><rect x="70" y="684" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="720" class="node-title">Desktop can open SSH</text><text x="92" y="753" class="node-body">Mac and Linux use system OpenSSH to connect</text><text x="92" y="778" class="node-body">to the chosen server. Sharing is not needed</text><text x="92" y="803" class="node-body">for this.</text><rect x="710" y="684" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="720" class="node-title">Phone can open SSH</text><text x="732" y="753" class="node-body">The saved copy works offline from the</text><text x="732" y="778" class="node-body">desktop if the phone can still reach the</text><text x="732" y="803" class="node-body">SSH server.</text><rect x="1350" y="917" width="440" height="151" rx="3" fill="#222529" stroke="#81a991" stroke-width="2"/><text x="1372" y="953" class="node-title">SSH server</text><text x="1372" y="986" class="node-body">Both clients connect here directly. The</text><text x="1372" y="1011" class="node-body">server account controls what commands may</text><text x="1372" y="1036" class="node-body">change.</text></svg>