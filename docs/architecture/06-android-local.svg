<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="2386" viewBox="0 0 1860 2386" role="img" aria-labelledby="title desc">
<title id="title">06 / Android local protection and limits</title><desc id="desc">Follow the saved copy from the lock screen to disk, memory, SSH, and removal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8d969b"/></marker></defs>
<style>
    text{font-family:Arial,DejaVu Sans,sans-serif;fill:#f2f3f3}
    .page-title{font-size:34px;font-weight:700}
    .section-title{font-size:30px;font-weight:700}
    .summary{font-size:19px;fill:#bdc3c6}
    .lane{font-size:18px;font-weight:700;letter-spacing:1px;fill:#bdc3c6}
    .node-title{font-size:21px;font-weight:700}
    .node-body{font-size:18px}
    .edge{font-size:16px;font-weight:700;fill:#f2f3f3}
    </style><rect width="1860" height="2386" fill="#17191c"/><text x="70" y="72" class="section-title">06 / Android local protection and limits</text><text x="70" y="110" class="summary">Follow the saved copy from the lock screen to disk, memory, SSH, and removal.</text><text x="70" y="172" class="lane">USER / PHONE APP</text><path d="M70,185 h440" stroke="#8d969b" stroke-width="1"/><text x="710" y="172" class="lane">STORAGE / DESKTOP</text><path d="M710,185 h440" stroke="#8d969b" stroke-width="1"/><text x="1350" y="172" class="lane">OUTCOME / LIMIT</text><path d="M1350,185 h440" stroke="#8d969b" stroke-width="1"/><path d="M290.0,369.0 L290.0,451.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="269.9" y="398.0" width="64.2" height="23" fill="#17191c"/><text x="302.0" y="415.0" text-anchor="middle" class="edge">launch</text><path d="M510,586.0 L1350,526.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="911.0" y="500.5" width="38.0" height="23" fill="#17191c"/><text x="930.0" y="517.5" text-anchor="middle" class="edge">No</text><path d="M290.0,721.0 L290.0,776.0 L930.0,776.0 L930.0,803.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="591.0" y="750.0" width="38.1" height="23" fill="#17191c"/><text x="610.0" y="767.0" text-anchor="middle" class="edge">Yes</text><path d="M930.0,979.0 L930.0,1061.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="870.8" y="1008.0" width="142.5" height="23" fill="#17191c"/><text x="942.0" y="1025.0" text-anchor="middle" class="edge">encrypted bytes</text><path d="M1150,1136.5 L1350,1136.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1200.5" y="1110.5" width="99.0" height="23" fill="#17191c"/><text x="1250.0" y="1127.5" text-anchor="middle" class="edge">key design</text><path d="M930.0,1212.0 L930.0,1267.0 L290.0,1267.0 L290.0,1294.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="530.0" y="1241.0" width="159.9" height="23" fill="#17191c"/><text x="610.0" y="1258.0" text-anchor="middle" class="edge">decrypted records</text><path d="M510,1382.0 L1350,1369.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="867.5" y="1343.5" width="125.1" height="23" fill="#17191c"/><text x="930.0" y="1360.5" text-anchor="middle" class="edge">process limit</text><path d="M290.0,1470.0 L290.0,1552.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="243.8" y="1499.0" width="116.4" height="23" fill="#17191c"/><text x="302.0" y="1516.0" text-anchor="middle" class="edge">leave / idle</text><path d="M290.0,1470.0 L290.0,1495.0 L1570.0,1495.0 L1570.0,1552.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="675.5" y="1469.0" width="125.1" height="23" fill="#17191c"/><text x="738.0" y="1486.0" text-anchor="middle" class="edge">choose Unpair</text><path d="M510,1640.0 L710,1615.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="547.5" y="1589.0" width="125.1" height="23" fill="#17191c"/><text x="610.0" y="1606.0" text-anchor="middle" class="edge">disk retained</text><path d="M1570.0,1822.0 L1570.0,1847.0 L290.0,1847.0 L290.0,1904.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1089.9" y="1821.0" width="64.2" height="23" fill="#17191c"/><text x="1122.0" y="1838.0" text-anchor="middle" class="edge">Cancel</text><path d="M1570.0,1822.0 L1570.0,1904.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1536.8" y="1851.0" width="90.3" height="23" fill="#17191c"/><text x="1582.0" y="1868.0" text-anchor="middle" class="edge">confirmed</text><path d="M930.0,1678.0 L930.0,1904.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="879.5" y="1779.0" width="125.1" height="23" fill="#17191c"/><text x="942.0" y="1796.0" text-anchor="middle" class="edge">storage limit</text><path d="M510,2200.0 L710,2212.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="564.9" y="2174.0" width="90.3" height="23" fill="#17191c"/><text x="610.0" y="2191.0" text-anchor="middle" class="edge">device ID</text><path d="M1150,2212.5 L1350,2212.5" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1152.7" y="2186.5" width="194.7" height="23" fill="#17191c"/><text x="1250.0" y="2203.5" text-anchor="middle" class="edge">access already copied</text><rect x="70" y="218" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="254" class="node-title">Protect the window</text><text x="92" y="287" class="node-body">Android FLAG_SECURE blocks ordinary</text><text x="92" y="312" class="node-body">screenshots and recent-app previews of</text><text x="92" y="337" class="node-body">Harbor.</text><path d="M290.0,451 L510,586.0 L290.0,721 L70,586.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="290.0" y="520" text-anchor="middle" class="node-title">Device unlock succeeds?</text><text x="290.0" y="550" text-anchor="middle" class="node-body">Android asks for its</text><text x="290.0" y="574" text-anchor="middle" class="node-body">configured PIN, pattern,</text><text x="290.0" y="598" text-anchor="middle" class="node-body">or password. This is a</text><text x="290.0" y="622" text-anchor="middle" class="node-body">screen gate, not a</text><text x="290.0" y="646" text-anchor="middle" class="node-body">separate Harbor PIN.</text><rect x="1350" y="451" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="487" class="node-title">Remain locked</text><text x="1372" y="520" class="node-body">No device credential or canceled</text><text x="1372" y="545" class="node-body">confirmation leaves hosts hidden and SSH</text><text x="1372" y="570" class="node-body">closed.</text><rect x="710" y="803" width="440" height="176" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="839" class="node-title">Read one saved value</text><text x="732" y="872" class="node-body">Pairing and hosts share one private app</text><text x="732" y="897" class="node-body">setting. Android's app sandbox keeps</text><text x="732" y="922" class="node-body">ordinary other apps out; a read error does</text><text x="732" y="947" class="node-body">not reset data.</text><rect x="710" y="1061" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1097" class="node-title">Decrypt local storage</text><text x="732" y="1130" class="node-body">AES-128-GCM locks and checks saved data.</text><text x="732" y="1155" class="node-body">Android Keystore's RSA key locks the random</text><text x="732" y="1180" class="node-body">AES data key (RSA-OAEP).</text><rect x="1350" y="1061" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="1097" class="node-title">Separate gate and key</text><text x="1372" y="1130" class="node-body">The storage key does not require every</text><text x="1372" y="1155" class="node-body">screen unlock. Hardware backing and secure</text><text x="1372" y="1180" class="node-body">RAM erasure are unproven.</text><rect x="70" y="1294" width="440" height="176" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1330" class="node-title">Use records in memory</text><text x="92" y="1363" class="node-body">After unlock, decrypted hosts and a</text><text x="92" y="1388" class="node-body">selected SSH credential enter app memory.</text><text x="92" y="1413" class="node-body">No host editor or credential-reveal action</text><text x="92" y="1438" class="node-body">is offered.</text><rect x="1350" y="1294" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1330" class="node-title">Device limit</text><text x="1372" y="1363" class="node-body">A rooted or compromised phone may inspect</text><text x="1372" y="1388" class="node-body">process memory. The interactive SSH shell</text><text x="1372" y="1413" class="node-body">can still change remote data.</text><rect x="70" y="1552" width="440" height="176" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1588" class="node-title">Pause or wait five minutes</text><text x="92" y="1621" class="node-body">Background pause or tracked inactivity</text><text x="92" y="1646" class="node-body">closes all SSH sessions, clears visible</text><text x="92" y="1671" class="node-body">hosts, and returns to the locked first</text><text x="92" y="1696" class="node-body">screen.</text><rect x="710" y="1552" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1588" class="node-title">Encrypted copy persists</text><text x="732" y="1621" class="node-body">Unlock reloads the saved copy. Backup and</text><text x="732" y="1646" class="node-body">device transfer are disabled for this app.</text><path d="M1570.0,1552 L1790,1687.0 L1570.0,1822 L1350,1687.0 Z" fill="#222529" stroke="#c6a470" stroke-width="2"/><text x="1570.0" y="1621" text-anchor="middle" class="node-title">Confirm Unpair?</text><text x="1570.0" y="1651" text-anchor="middle" class="node-body">While unlocked, Cancel</text><text x="1570.0" y="1675" text-anchor="middle" class="node-body">keeps data. Confirm</text><text x="1570.0" y="1699" text-anchor="middle" class="node-body">deletes local saved</text><text x="1570.0" y="1723" text-anchor="middle" class="node-body">entries, closes SSH, and</text><text x="1570.0" y="1747" text-anchor="middle" class="node-body">clears the UI.</text><rect x="70" y="1904" width="440" height="126" rx="3" fill="#222529" stroke="#81a991" stroke-width="2"/><text x="92" y="1940" class="node-title">Cancel keeps data</text><text x="92" y="1973" class="node-body">The phone stays paired. Saved hosts and</text><text x="92" y="1998" class="node-body">existing sessions are unchanged.</text><rect x="710" y="1904" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1940" class="node-title">Newest save may be lost</text><text x="732" y="1973" class="node-body">Android saves this setting in the</text><text x="732" y="1998" class="node-body">background. A sudden crash may lose the</text><text x="732" y="2023" class="node-body">newest update (SharedPreferences.apply).</text><rect x="1350" y="1904" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="1940" class="node-title">Local removal only</text><text x="1372" y="1973" class="node-body">Unpair does not revoke the desktop or</text><text x="1372" y="1998" class="node-body">delete the plugin's Keystore RSA alias. A</text><text x="1372" y="2023" class="node-body">detected deletion error is shown.</text><rect x="70" y="2137" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="2173" class="node-title">Separately: Revoke</text><text x="92" y="2206" class="node-body">On the desktop, choose a paired phone and</text><text x="92" y="2231" class="node-body">remove its registration.</text><rect x="710" y="2137" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="2173" class="node-title">Block future sync</text><text x="732" y="2206" class="node-body">Desktop deletes that phone's sync key.</text><text x="732" y="2231" class="node-body">Later sync gets 403, but old offline hosts</text><text x="732" y="2256" class="node-body">stay on the phone.</text><rect x="1350" y="2137" width="440" height="151" rx="3" fill="#222529" stroke="#ba7f7b" stroke-width="2"/><text x="1372" y="2173" class="node-title">Stop SSH at server</text><text x="1372" y="2206" class="node-body">Revocation cannot remotely wipe copied</text><text x="1372" y="2231" class="node-body">credentials or open SSH. Rotate passwords,</text><text x="1372" y="2256" class="node-body">keys, or server policy there.</text></svg>