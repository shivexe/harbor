<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="2747" viewBox="0 0 1860 2747" role="img" aria-labelledby="title desc">
<title id="title">08 / How to draw a system from a brief</title><desc id="desc">Repeat this trace for each user action. Draw owners, moving data, checks, and what survives a failure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8d969b"/></marker></defs>
<style>
    text{font-family:Arial,DejaVu Sans,sans-serif;fill:#f2f3f3}
    .page-title{font-size:34px;font-weight:700}
    .section-title{font-size:30px;font-weight:700}
    .summary{font-size:19px;fill:#bdc3c6}
    .lane{font-size:18px;font-weight:700;letter-spacing:1px;fill:#bdc3c6}
    .node-title{font-size:21px;font-weight:700}
    .node-body{font-size:18px}
    .edge{font-size:16px;font-weight:700;fill:#f2f3f3}
    </style><rect width="1860" height="2747" fill="#17191c"/><text x="70" y="72" class="section-title">08 / How to draw a system from a brief</text><text x="70" y="110" class="summary">Repeat this trace for each user action. Draw owners, moving data, checks, and what survives a failure.</text><text x="70" y="172" class="lane">ASK</text><path d="M70,185 h440" stroke="#8d969b" stroke-width="1"/><text x="710" y="172" class="lane">TRACE</text><path d="M710,185 h440" stroke="#8d969b" stroke-width="1"/><text x="1350" y="172" class="lane">DRAW / VERIFY</text><path d="M1350,185 h440" stroke="#8d969b" stroke-width="1"/><path d="M290.0,344.0 L290.0,399.0 L930.0,399.0 L930.0,426.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="573.5" y="373.0" width="72.9" height="23" fill="#17191c"/><text x="610.0" y="390.0" text-anchor="middle" class="edge">actions</text><path d="M930.0,577.0 L930.0,632.0 L1570.0,632.0 L1570.0,659.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1204.8" y="606.0" width="90.3" height="23" fill="#17191c"/><text x="1250.0" y="623.0" text-anchor="middle" class="edge">ownership</text><path d="M1570.0,810.0 L1570.0,835.0 L290.0,835.0 L290.0,892.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1055.1" y="809.0" width="133.8" height="23" fill="#17191c"/><text x="1122.0" y="826.0" text-anchor="middle" class="edge">data locations</text><path d="M290.0,1043.0 L290.0,1098.0 L930.0,1098.0 L930.0,1125.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="564.9" y="1072.0" width="90.3" height="23" fill="#17191c"/><text x="610.0" y="1089.0" text-anchor="middle" class="edge">crossings</text><path d="M930.0,1251.0 L930.0,1306.0 L1570.0,1306.0 L1570.0,1333.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1191.8" y="1280.0" width="116.4" height="23" fill="#17191c"/><text x="1250.0" y="1297.0" text-anchor="middle" class="edge">request path</text><path d="M1570.0,1484.0 L1570.0,1509.0 L290.0,1509.0 L290.0,1566.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1089.9" y="1483.0" width="64.2" height="23" fill="#17191c"/><text x="1122.0" y="1500.0" text-anchor="middle" class="edge">checks</text><path d="M290.0,1717.0 L290.0,1772.0 L930.0,1772.0 L930.0,1799.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="560.5" y="1746.0" width="99.0" height="23" fill="#17191c"/><text x="610.0" y="1763.0" text-anchor="middle" class="edge">state left</text><path d="M930.0,1950.0 L930.0,2005.0 L1570.0,2005.0 L1570.0,2032.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1204.8" y="1979.0" width="90.3" height="23" fill="#17191c"/><text x="1250.0" y="1996.0" text-anchor="middle" class="edge">lifecycle</text><path d="M1570.0,2183.0 L1570.0,2208.0 L290.0,2208.0 L290.0,2265.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1081.2" y="2182.0" width="81.6" height="23" fill="#17191c"/><text x="1122.0" y="2199.0" text-anchor="middle" class="edge">evidence</text><path d="M290.0,2416.0 L290.0,2441.0 L1570.0,2441.0 L1570.0,2498.0" fill="none" stroke="#8d969b" stroke-width="2" marker-end="url(#arrow)"/><rect x="692.9" y="2415.0" width="90.3" height="23" fill="#17191c"/><text x="738.0" y="2432.0" text-anchor="middle" class="edge">scenarios</text><rect x="70" y="218" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="254" class="node-title">1. Name user actions</text><text x="92" y="287" class="node-body">Write verb and object: save host, pair</text><text x="92" y="312" class="node-body">phone, sync, connect, revoke.</text><rect x="710" y="426" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="462" class="node-title">2. Name each owner</text><text x="732" y="495" class="node-body">Person, desktop, phone, and SSH server.</text><text x="732" y="520" class="node-body">Mark who may write each record; Harbor</text><text x="732" y="545" class="node-body">hosts have one desktop owner.</text><rect x="1350" y="659" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="695" class="node-title">3. Place stored data</text><text x="1372" y="728" class="node-body">Locate host records, credentials, pairing</text><text x="1372" y="753" class="node-body">keys, and revision. Mark disk or temporary</text><text x="1372" y="778" class="node-body">memory.</text><rect x="70" y="892" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="928" class="node-title">4. Draw boundaries</text><text x="92" y="961" class="node-body">Draw device, process, and network edges.</text><text x="92" y="986" class="node-body">Ask what still works when a device is</text><text x="92" y="1011" class="node-body">offline.</text><rect x="710" y="1125" width="440" height="126" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1161" class="node-title">5. Trace one success</text><text x="732" y="1194" class="node-body">Number each send, check, write, and reply.</text><text x="732" y="1219" class="node-body">Put the moved data on every arrow.</text><rect x="1350" y="1333" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="1369" class="node-title">6. Check each crossing</text><text x="1372" y="1402" class="node-body">Ask: who is sending, who may act, and can</text><text x="1372" y="1427" class="node-body">someone read or alter it? Draw separate</text><text x="1372" y="1452" class="node-body">checks.</text><rect x="70" y="1566" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="1602" class="node-title">7. Draw failure branches</text><text x="92" y="1635" class="node-body">Wrong key, timeout, cancel, duplicate, old</text><text x="92" y="1660" class="node-body">reply, or failed write: say which saved</text><text x="92" y="1685" class="node-body">state remains.</text><rect x="710" y="1799" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="732" y="1835" class="node-title">8. Follow its lifetime</text><text x="732" y="1868" class="node-body">Include creation, unlock, background, exit,</text><text x="732" y="1893" class="node-body">revocation, and deletion for each secret</text><text x="732" y="1918" class="node-body">and session.</text><rect x="1350" y="2032" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="2068" class="node-title">9. Match code to boxes</text><text x="1372" y="2101" class="node-body">Find the real module and library for each</text><text x="1372" y="2126" class="node-body">step. Add limits. Do not invent a server</text><text x="1372" y="2151" class="node-body">when direct links suffice.</text><rect x="70" y="2265" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="92" y="2301" class="node-title">10. Walk real cases</text><text x="92" y="2334" class="node-body">Phone SSH with desktop offline; changed</text><text x="92" y="2359" class="node-body">server key; failed sync; revoked phone;</text><text x="92" y="2384" class="node-body">ended shell.</text><rect x="1350" y="2498" width="440" height="151" rx="3" fill="#222529" stroke="#8d969b" stroke-width="2"/><text x="1372" y="2534" class="node-title">Final check</text><text x="1372" y="2567" class="node-body">Every arrow names data; every write names</text><text x="1372" y="2592" class="node-body">owner; every secret has holder and</text><text x="1372" y="2617" class="node-body">lifetime; every failure says what stays.</text></svg>